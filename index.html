<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bean Game: College Edition</title><style>body{font:16px system-ui;background:#f3f7fa;color:#183a50;margin:0}header{background:#155575;color:white;padding:24px}main{max-width:900px;margin:24px auto;padding:0 15px}.panel{background:white;padding:24px;border-radius:15px;box-shadow:0 3px 16px #1232;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.item{border:1px solid #ccdce5;border-radius:10px;padding:12px}select,textarea,input{width:100%;padding:10px;box-sizing:border-box;font:inherit;border:1px solid #9bb7c6;border-radius:7px}label{display:block;font-weight:650;margin-bottom:6px}textarea{min-height:95px}.question{margin:16px 0}button{padding:12px 20px;border:0;border-radius:9px;background:#156486;color:white;font-weight:700;cursor:pointer}button.secondary{background:#dce9ef;color:#1b4257}button:disabled{opacity:.4}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.meter{background:#e9f3f8;border-radius:10px;padding:14px;margin:15px 0;font-weight:750}.bean{display:inline-block;background:#b77b40;width:12px;height:19px;border-radius:55%;transform:rotate(25deg);margin:3px}.spent{background:#c4d4de}.warning{background:#fff0d8;padding:10px;border-radius:7px}.success{background:#dff3e8;padding:10px;border-radius:7px}.stage{display:inline-block;padding:7px;margin:3px;background:#dce9ef;border-radius:8px;font-size:12px}.active{background:#155575;color:white}.event{border-left:5px solid #e8ad4c;background:#fff9ed;padding:12px;margin:16px 0}p{line-height:1.5}footer{text-align:center;color:#617888;font-size:12px;padding:20px}</style><header><h1>🫘 The Bean Game: College Edition</h1><p>Choose. Adapt. Plan for your future.</p></header><main><div id="steps"></div><div id="app"></div></main><footer>Based on the NGPF Bean Game, adapted for Phoenix College FYE (2024). Bean costs are illustrative, not actual prices. Your work stays in your browser.</footer><script>
const cats=[['Housing',[['Live with family; share utilities',2],['Share apartment',3],['Rent alone',4]]],['Food',[['Cook at home; occasional dinner out',2],['Frequent fast food and dinner out',3],['All meals away from home',4]]],['Auto insurance',[['No coverage (only if no car)',0],['Liability',2],['Comprehensive',3]]],['Health/disability insurance',[['No coverage',0],['Basic coverage',2]]],['Renters insurance',[['No coverage',0],['Coverage',1]]],['Clothing',[['Existing wardrobe',0],['Thrift or discount stores',1],['New clothes',2],['Designer clothes',3]]],['Laundry',[['Family home',0],['Laundromat',1],['Washer and dryer',2]]],['Transportation',[['Walk or bike',0],['Bus or carpool',1],['Fuel for family car',2],['Used car and gas',3],['New car and gas',4]]],['Recreation',[['Free activities',0],['Streaming',1],['Movies, gym, hobbies',2],['Concerts or sports',2],['Big vacation',3]]],['Furnishings',[['Secondhand from friends/family',0],['Used furniture',1],['Rent furniture',2],['New furniture',2]]],['Phone',[['No phone',0],['Limited data',1],['Unlimited data',2]]],['Home Wi-Fi',[['None',0],['Wi-Fi',1]]],['Personal care',[['Basic products',1],['Occasional haircut and basics',2],['Regular salon and brand products',3]]],['Gifts',[['None this month',0],['Homemade',1],['Occasional small gifts',2],['Frequent gifts',3]]],['Charitable/religious contributions',[['None',0],['Contribute',1]]],['Savings',[['No savings',0],['Save 5%',1],['Save 10%',2]]],['Retirement investing',[['None',0],['Invest',2]]]];
const prompts=[['priorities','What were your three most important spending priorities? How do they reflect your values?'],['tradeoffs','When your income fell from 20 to 15 beans, what did you change? Which trade-off was hardest?'],['emergency','What did the unexpected events teach you about insurance, emergency funds, and asking for support?'],['education','Identify two educational costs and two possible financial resources. Which resource would you investigate first, and why?'],['action','What specific step can you take in the next month toward financing your education?']];
const stages=['Welcome','20 beans','15 beans','Life Happens','College Future','Reflection','Download'];let s={step:0,first:cats.map(()=>0),second:cats.map(()=>0),life:{},college:{},answers:{},name:''};const $=q=>document.querySelector(q);const escapeHTML=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=a=>a.reduce((n,x,i)=>n+cats[i][1][x][1],0);const panel=(h,b)=>`<section class="panel"><h2>${h}</h2>${b}</section>`;const nav=(next='Continue')=>`<div class="actions"><button class="secondary" id="back">Back</button><button id="next">${next}</button></div>`;function wireNav(){ $('#back').onclick=()=>{s.step--;render()};$('#next').onclick=()=>{s.step++;render()}}function fields(keys,where){return keys.map(([k,q])=>`<div class="question"><label for="${k}">${escapeHTML(q)}</label><textarea id="${k}" data-k="${k}" placeholder="Write your answer...">${escapeHTML(s[where][k]||'')}</textarea></div>`).join('')};function wireFields(where,keys,min){document.querySelectorAll('textarea[data-k]').forEach(el=>el.oninput=()=>{s[where][el.dataset.k]=el.value;validate()});function validate(){ $('#next').disabled=!keys.every(k=>(s[where][k]||'').trim().length>=min)}validate()}
function budget(which,max){const a=s[which],remaining=max-total(a);let body=`<p>${which==='first'?'You earn 20 beans. Choose one option in each category and spend exactly 20 beans.':'Your work hours have been cut. You now have 15 beans. Adjust your choices to spend exactly 15 beans.'}</p><p>These are simplified fictional costs, not actual prices.</p><div class="meter"><div>${remaining} beans remaining of ${max}</div><div>${Array.from({length:max},(_,i)=>`<span class="bean ${i<total(a)?'spent':''}"></span>`).join('')}</div></div>${remaining===0?'<p class="success">Your budget balances!</p>':`<p class="warning">${remaining<0?'You are over budget.':'You still have beans to allocate.'} Spend exactly ${max} to continue.</p>`}<div class="grid">${cats.map(([name,opts],i)=>`<div class="item"><label for="cat${i}">${escapeHTML(name)}</label><select id="cat${i}" data-i="${i}">${opts.map(([v,c],j)=>`<option value="${j}" ${a[i]===j?'selected':''}>${escapeHTML(v)} (${c} beans)</option>`).join('')}</select></div>`).join('')}</div>${nav()}`;$('#app').innerHTML=panel(which==='first'?'Round 1: Your 20-bean budget':'Round 2: Your 15-bean budget',body);wireNav();$('#next').disabled=remaining!==0;document.querySelectorAll('select[data-i]').forEach(el=>el.onchange=e=>{a[+e.target.dataset.i]=+e.target.value;budget(which,max)});$('#next').onclick=()=>{if(total(a)!==max)return;if(which==='first')s.second=[...s.first];s.step++;render()}}
function life(){let insuredHealth=s.second[3]>0,insuredProperty=s.second[4]>0;$('#app').innerHTML=panel('Round 3: Life Happens',`<p>Your budget is already allocated. Unexpected events may create additional costs. Explain your response to each event.</p><div class="event"><h3>1. You broke your leg</h3><p>${insuredHealth?'You selected basic health coverage. In the original game, you pay 0 extra beans.':'You selected no health coverage. In the original game, this costs 3 extra beans.'}</p>${fields([['medical','How would you handle this situation?']],'life')}</div><div class="event"><h3>2. Your friends invite you on a beach vacation</h3><p>Joining costs 3 beans. Declining costs 0 beans.</p><label for="tripchoice">Your decision</label><select id="tripchoice"><option value="">Choose...</option><option value="join" ${s.life.tripchoice==='join'?'selected':''}>Join (+3 beans)</option><option value="decline" ${s.life.tripchoice==='decline'?'selected':''}>Decline (+0 beans)</option></select>${fields([['trip','Why did you choose this?']],'life')}</div><div class="event"><h3>3. A leak destroys your computer</h3><p>${insuredProperty?'You selected renters insurance. In the original game, you pay 0 extra beans.':'You selected no renters insurance. In the original game, this costs 2 extra beans.'}</p>${fields([['computer','How would you respond, especially if you need the computer for college?']],'life')}</div>${nav()}`);wireNav();$('#tripchoice').onchange=e=>{s.life.tripchoice=e.target.value;check()};['medical','trip','computer'].forEach(k=>$('#'+k).oninput=e=>{s.life[k]=e.target.value;check()});function check(){$('#next').disabled=!s.life.tripchoice||!['medical','trip','computer'].every(k=>(s.life[k]||'').trim().length>=15)}check()}
function college(){$('#app').innerHTML=panel('Round 4: College Future',`<p>Imagine preparing for your next semester at Phoenix College. Think about tuition, fees, books, transportation, technology, childcare, and time away from paid work.</p><p><strong>Possible resources:</strong> Grants, scholarships, financial aid, student loans, campus employment, and emergency assistance. Loans generally must be repaid; eligibility for resources varies.</p>${fields([['costs','Name at least two educational costs you would need to plan for.'],['resources','Identify at least two possible funding resources. How are they different?'],['plan','Which resource would you investigate first, and what would you do to find out if you qualify?']],'college')}${nav()}`);wireNav();wireFields('college',['costs','resources','plan'],15)}
function reflection(){$('#app').innerHTML=panel('Round 5: Reflect on your choices',`<p><strong>Writing expectation:</strong> Write at least 20 words for <strong>each</strong> reflection question. Use specific examples from your game decisions. All reflection responses will appear in your downloaded submission document.</p>${fields(prompts,'answers')}${nav('Review and download')}`);wireNav();document.querySelectorAll('textarea[data-k]').forEach(el=>{el.oninput=()=>{s.answers[el.dataset.k]=el.value;updateReflectionStatus()}});const next=$('#next');const status=document.createElement('p');status.id='reflectionStatus';status.setAttribute('role','status');next.parentNode.before(status);const wordCount=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;function updateReflectionStatus(){const done=prompts.filter(([k])=>wordCount(s.answers[k])>=20).length;status.textContent=done+' of '+prompts.length+' reflection answers meet the 20-word minimum. '+(done===prompts.length?'You are ready to continue.':'Please complete each answer to unlock the next step.');next.disabled=done!==prompts.length;document.querySelectorAll('textarea[data-k]').forEach(el=>{const n=wordCount(s.answers[el.dataset.k]);let counter=document.getElementById('count_'+el.dataset.k);if(!counter){counter=document.createElement('small');counter.id='count_'+el.dataset.k;counter.setAttribute('aria-live','polite');el.after(counter)}counter.textContent=n+' / 20 words'+(n>=20?' ✓':'');});}updateReflectionStatus()}
function rows(a){return `<table style="border-collapse:collapse;width:100%"><tr><th align="left">Category</th><th align="left">Choice</th><th>Beans</th></tr>${cats.map(([name,opts],i)=>`<tr><td style="border:1px solid #ddd;padding:5px">${escapeHTML(name)}</td><td style="border:1px solid #ddd;padding:5px">${escapeHTML(opts[a[i]][0])}</td><td style="border:1px solid #ddd;padding:5px;text-align:center">${opts[a[i]][1]}</td></tr>`).join('')}</table>`}
function doc(){return `<html><head><meta charset="utf-8"><style>body{font-family:Arial;color:#263b4a;line-height:1.4}h1,h2{color:#155575}h2{margin-top:24px}table{font-size:10pt}th{background:#e5f0f5}</style></head><body><h1>The Bean Game: College Edition</h1><p><b>Student:</b> ${escapeHTML(s.name||'Not provided')}<br><b>Competency:</b> Identify costs and financial resources necessary to achieving educational and career goals.</p><h2>Initial budget — 20 beans</h2><p>Allocated: ${total(s.first)} beans</p>${rows(s.first)}<h2>Revised budget — 15 beans</h2><p>Allocated: ${total(s.second)} beans</p>${rows(s.second)}<h2>Life Happens</h2><p><b>Medical event:</b> ${s.second[3]>0?0:3} extra beans<br>${escapeHTML(s.life.medical)}</p><p><b>Beach trip:</b> ${s.life.tripchoice==='join'?'Joined (+3 beans)':'Declined (0 beans)'}<br>${escapeHTML(s.life.trip)}</p><p><b>Computer damage:</b> ${s.second[4]>0?0:2} extra beans<br>${escapeHTML(s.life.computer)}</p><h2>College Future</h2>${[['Educational costs',s.college.costs],['Financial resources',s.college.resources],['First step',s.college.plan]].map(([q,a])=>`<h3>${q}</h3><p>${escapeHTML(a).replace(/\n/g,'<br>')}</p>`).join('')}<h2>Final Reflection</h2>${prompts.map(([k,q])=>`<h3>${escapeHTML(q)}</h3><p>${escapeHTML(s.answers[k]).replace(/\n/g,'<br>')}</p>`).join('')}<p><small>Educational simulation based on the NGPF Bean Game; bean costs are illustrative.</small></p></body></html>`}
function finish(){$('#app').innerHTML=panel('Your submission is ready!',`<p>Your downloaded document will include both budgets, your decisions during Life Happens, your college planning answers, and your reflection.</p><div class="question"><label for="student">Your name (optional)</label><input id="student" value="${escapeHTML(s.name)}" placeholder="Your name"></div><p class="success">No login needed. Your responses stay on this device and are not sent to a server.</p><div class="actions"><button class="secondary" id="back">Edit reflection</button><button id="download">Download completed document</button></div><p><strong>To submit:</strong> Download the Word-compatible .doc file, open it in Google Docs if you wish to review or edit it, then upload the completed file to your Canvas assignment.</p><p><strong>Important:</strong> Download before closing or refreshing this page; progress is not saved.</p>`);$('#student').oninput=e=>s.name=e.target.value;$('#back').onclick=()=>{s.step--;render()};$('#download').onclick=()=>{let blob=new Blob(['\ufeff',doc()],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Bean_Game_'+(s.name||'Student').replace(/[^a-z0-9_-]/gi,'_')+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}}
function render(){$('#steps').innerHTML=stages.map((t,i)=>`<span class="stage ${s.step===i?'active':''}">${i+1}. ${t}</span>`).join('');if(s.step===0){$('#app').innerHTML=panel('Welcome to the Bean Game',`<p>In this interactive simulation you will spend 20 beans, adapt to a reduced income, handle unexpected events, and identify ways to pay for college.</p><p>You may imagine a fictional budget. You do not need to disclose your personal financial situation.</p><p><b>Reflection expectations:</b> Answer every final reflection question using at least <strong>20 words per answer</strong>. The Continue button unlocks when all reflection responses meet the minimum.</p><p><b>Time:</b> Approximately 30–45 minutes. Your answers remain in this browser; do not refresh before downloading.</p><button id="start">Start playing</button>`);$('#start').onclick=()=>{s.step=1;render()}}else if(s.step===1)budget('first',20);else if(s.step===2)budget('second',15);else if(s.step===3)life();else if(s.step===4)college();else if(s.step===5)reflection();else finish();window.scrollTo(0,0)}render();
</script></html>
